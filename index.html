<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고전을 전자책으로</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; }
.app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
.header { padding: 1.5rem 1.25rem 1.25rem; border-bottom: 1px solid #ebebeb; }
.logo { height: 36px; margin-bottom: 1rem; }
.header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.header p { font-size: 12px; color: #aaa; margin-top: 5px; letter-spacing: 0.3px; }
.filter-row { display: flex; gap: 8px; padding: 12px 1.25rem; overflow-x: auto; border-bottom: none; }
.filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 1px solid #ddd; background: none; cursor: pointer; color: #888; white-space: nowrap; }
.filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.star-legend { font-size: 11px; color: #bbb; padding: 0 1.25rem 12px; border-bottom: 1px solid #ebebeb; letter-spacing: 0.2px; }
.book-list { padding: 1.25rem; display: flex; flex-direction: column; gap: 12px; }
.book-card { background: #fff; border: 1px solid #ebebeb; border-radius: 14px; padding: 1.1rem 1.25rem; cursor: pointer; transition: box-shadow 0.15s; }
.book-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-color: #ddd; }
.book-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.book-title { font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -0.2px; }
.book-title-ko { font-size: 13px; color: #999; margin-top: 3px; }
.stars { font-size: 11px; white-space: nowrap; letter-spacing: 1px; }
.book-meta { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #f7f7f7; color: #888; border: 1px solid #efefef; }
.book-blurb { font-size: 13px; color: #777; margin-top: 9px; line-height: 1.65; }
.detail-view { padding: 0 1.25rem 2rem; display: none; }
.back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; background: none; border: none; cursor: pointer; padding: 1.2rem 0; }
.detail-title { font-size: 22px; font-weight: 600; line-height: 1.4; letter-spacing: -0.5px; }
.detail-ko { font-size: 15px; color: #999; margin-top: 4px; }
.detail-stars { font-size: 15px; margin-top: 10px; letter-spacing: 1px; }
.detail-blurb { font-size: 15px; color: #666; margin-top: 18px; line-height: 1.75; border-left: 2px solid #ebebeb; padding-left: 14px; }
.section-label { font-size: 11px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; }
.media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.media-badge { font-size: 12px; padding: 7px 10px; border-radius: 8px; text-align: center; }
.media-on { background: #f7f7f7; color: #1a1a1a; border: 1px solid #e0e0e0; font-weight: 500; }
.media-off { color: #ddd; border: 1px solid #f0f0f0; }
.ebook-btn { display: block; text-align: center; padding: 13px; border-radius: 12px; background: #1a1a1a; color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 24px; }
.ebook-btn:hover { background: #333; }
.comment-section { margin-top: 8px; }
.comment-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
.comment-input { flex: 1; font-size: 13px; padding: 9px 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-family: inherit; }
.comment-input:focus { border-color: #1a1a1a; }
.comment-submit { font-size: 12px; padding: 9px 14px; border-radius: 10px; background: #1a1a1a; color: #fff; border: none; cursor: pointer; white-space: nowrap; }
.comment-submit:hover { background: #333; }
.comment-list { display: flex; flex-direction: column; gap: 10px; }
.comment-item { background: #f9f9f7; border-radius: 10px; padding: 10px 13px; }
.comment-text { font-size: 13px; color: #444; line-height: 1.6; }
.comment-time { font-size: 11px; color: #bbb; margin-top: 4px; }
.comment-empty { font-size: 13px; color: #ccc; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
<div class="app">
  <div id="list-view">
    <div class="header">
      <img class="logo" src="웹용.jpg" alt="서울연구원 정보자료실">
      <h1>고전을 전자책으로</h1>
      <p>BBC, TIME, Guardian, Le Monde — 네 매체가 공통으로 선정한 고전을 전자책으로 만나보세요.</p>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterBooks('all',this)">전체</button>
      <button class="filter-btn" onclick="filterBooks('4',this)">✒️✒️✒️✒️</button>
      <button class="filter-btn" onclick="filterBooks('3',this)">✒️✒️✒️</button>
      <button class="filter-btn" onclick="filterBooks('2',this)">✒️✒️</button>
    </div>
    <div class="star-legend">✒️는 BBC, TIME, Guardian, Le Monde 선정 매체 수를 나타냅니다.</div>
    <div class="book-list" id="book-list"></div>
  </div>
  <div id="detail-view" class="detail-view"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDo4sxW0D70XcMBBhTn17WWJGq5prEhi2g",
  authDomain: "classic-books-3c937.firebaseapp.com",
  projectId: "classic-books-3c937",
  storageBucket: "classic-books-3c937.firebasestorage.app",
  messagingSenderId: "472971686422",
  appId: "1:472971686422:web:7ff3f824b149079691fb37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const books = [
  { en:"The Big Sleep", ko:"빅 슬립", author:"Raymond Chandler", year:1939, stars:4, bbc:true, time:true, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=4808956050898&cttsDvsnCode=001", blurb:"도시의 뒷골목, 권력의 부패, 도덕적 회색지대 — 4개 매체 모두가 선택한 이 목록의 유일한 ✒️✒️✒️✒️." },
  { en:"Brave New World", ko:"멋진 신세계", author:"Aldous Huxley", year:1932, stars:3, bbc:true, time:false, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D240967680&cttsDvsnCode=001", blurb:"억압이 아닌 쾌락으로 통제되는 사회. 오웰이 두려움을 경고했다면, 헉슬리는 편안함을 경고했다." },
  { en:"Nineteen Eighty-Four", ko:"1984", author:"George Orwell", year:1949, stars:3, bbc:true, time:false, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480N260422050&cttsDvsnCode=001", blurb:"빅브라더를 두려워하던 시대가 있었다. 지금 우리는 스스로 빅브라더가 되어가고 있지는 않은가." },
  { en:"The Great Gatsby", ko:"위대한 개츠비", author:"F. Scott Fitzgerald", year:1925, stars:3, bbc:false, time:true, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D260479460&cttsDvsnCode=001", blurb:"꿈을 향해 평생 달려가다 결국 혼자 남은 사람. 아메리칸 드림의 가장 아름다운 부고." },
  { en:"The Grapes of Wrath", ko:"분노의 포도", author:"John Steinbeck", year:1939, stars:3, bbc:false, time:true, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=4808949715582&cttsDvsnCode=001", blurb:"집을 잃고 길 위에 선 사람들. 1930년대 미국의 이야기인가, 지금 어딘가의 이야기인가." },
  { en:"The Catcher in the Rye", ko:"호밀밭의 파수꾼", author:"J. D. Salinger", year:1951, stars:3, bbc:false, time:true, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D240559130&cttsDvsnCode=001", blurb:"가짜인 척하는 세상에서 진짜이고 싶었던 사람." },
  { en:"For Whom the Bell Tolls", ko:"누구를 위하여 종은 울리나", author:"Ernest Hemingway", year:1940, stars:2, bbc:false, time:false, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D150131170&cttsDvsnCode=001", blurb:"전쟁 한가운데서 사랑을 선택한 사람. 헤밍웨이가 가장 직접적으로 삶과 죽음을 쓴 소설." },
  { en:"Middlemarch", ko:"미들마치", author:"George Eliot", year:1871, stars:2, bbc:true, time:false, guardian:true, lemonde:false, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D250533300&cttsDvsnCode=001", blurb:"이상과 현실 사이에서 살아가는 사람들. 영어로 쓰인 가장 위대한 소설 중 하나." },
  { en:"Frankenstein", ko:"프랑켄슈타인", author:"Mary Shelley", year:1818, stars:2, bbc:true, time:false, guardian:true, lemonde:false, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=4808931025347&cttsDvsnCode=001", blurb:"창조자의 욕망과 피조물의 비극. AI 시대에 다시 읽어야 할 200년 전 경고." },
  { en:"The Hound of the Baskervilles", ko:"바스커빌 가의 개", author:"Arthur Conan Doyle", year:1902, stars:2, bbc:true, time:false, guardian:true, lemonde:false, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D130504590&cttsDvsnCode=001", blurb:"셜록 홈즈 시리즈의 정점. 추리소설이 하나의 장르가 된 순간." },
  { en:"Gone with the Wind", ko:"바람과 함께 사라지다", author:"Margaret Mitchell", year:1936, stars:2, bbc:false, time:false, guardian:true, lemonde:true, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=480D231102870&cttsDvsnCode=001", blurb:"전쟁이 모든 것을 앗아간 뒤에도, 내일은 내일의 태양이 뜬다." },
  { en:"The Sound and the Fury", ko:"소리와 분노", author:"William Faulkner", year:1929, stars:2, bbc:false, time:true, guardian:true, lemonde:false, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=4808949715056&cttsDvsnCode=001", blurb:"한 가문의 몰락을 네 개의 시선으로. 20세기 미국 문학의 가장 실험적인 걸작." },
  { en:"Ulysses", ko:"율리시스", author:"James Joyce", year:1922, stars:2, bbc:true, time:false, guardian:true, lemonde:false, url:"https://si.dkyobobook.co.kr/content/contentView.ink?brcd=4808949714967&cttsDvsnCode=001", blurb:"읽기 가장 어렵다고 알려진 소설. 그러나 한 줄 한 줄이 살아있다." }
];

let currentFilter = 'all';
function starsStr(n) { return '✒️'.repeat(n); }

function timeAgo(ts) {
  if (!ts) return '';
  const now = Date.now();
  const diff = now - ts.toMillis();
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}시간 전`;
  const day = Math.floor(hr / 24);
  return `${day}일 전`;
}

window.renderList = function() {
  const list = document.getElementById('book-list');
  const filtered = currentFilter==='all' ? books : books.filter(b=>b.stars===parseInt(currentFilter));
  list.innerHTML = filtered.map((b)=>`
    <div class="book-card" onclick="showDetail(${books.indexOf(b)})">
      <div class="book-header">
        <div><div class="book-title">${b.en}</div><div class="book-title-ko">${b.ko}</div></div>
        <div class="stars">${starsStr(b.stars)}</div>
      </div>
      <div class="book-meta"><span class="badge">${b.author}</span><span class="badge">${b.year}</span></div>
      <div class="book-blurb">${b.blurb}</div>
    </div>`).join('');
}

window.filterBooks = function(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

window.showDetail = async function(idx) {
  const b = books[idx];
  document.getElementById('list-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  const media = ['BBC','TIME','Guardian','Le Monde'];
  const keys = ['bbc','time','guardian','lemonde'];

  dv.innerHTML = `
    <button class="back-btn" onclick="showList()">← 목록으로</button>
    <div class="detail-title">${b.en}</div>
    <div class="detail-ko">${b.ko} · ${b.author} · ${b.year}</div>
    <div class="detail-stars">${starsStr(b.stars)}</div>
    <div class="detail-blurb">${b.blurb}</div>
    <div class="section-label">매체 선정 현황</div>
    <div class="media-grid">${media.map((m,i)=>`<div class="media-badge ${b[keys[i]]?'media-on':'media-off'}">${b[keys[i]]?'✓ ':''}${m}</div>`).join('')}</div>
    <a class="ebook-btn" href="${b.url}" target="_blank">전자책으로 읽기</a>
    <div class="section-label">한줄평</div>
    <div class="comment-section">
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input-${idx}" placeholder="이 책에 대한 한줄평을 남겨보세요" maxlength="100">
        <button class="comment-submit" onclick="submitComment(${idx})">등록</button>
      </div>
      <div class="comment-list" id="comment-list-${idx}">
        <div class="comment-empty">불러오는 중...</div>
      </div>
    </div>`;

  loadComments(idx);
}

window.showList = function() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
}

window.loadComments = async function(idx) {
  const bookId = books[idx].en.replace(/\s/g, '-').toLowerCase();
  const container = document.getElementById(`comment-list-${idx}`);
  try {
    const q = query(collection(db, 'comments'), where('bookId', '==', bookId), orderBy('createdAt', 'desc'));
    const snapshot = await getDocs(q);
    if (snapshot.empty) {
      container.innerHTML = '<div class="comment-empty">아직 한줄평이 없어요. 첫 번째로 남겨보세요!</div>';
      return;
    }
    container.innerHTML = snapshot.docs.map(doc => {
      const d = doc.data();
      return `<div class="comment-item">
        <div class="comment-text">${d.text}</div>
        <div class="comment-time">${timeAgo(d.createdAt)}</div>
      </div>`;
    }).join('');
  } catch(e) {
    container.innerHTML = '<div class="comment-empty">불러오기 실패</div>';
  }
}

window.submitComment = async function(idx) {
  const input = document.getElementById(`comment-input-${idx}`);
  const text = input.value.trim();
  if (!text) return;
  const bookId = books[idx].en.replace(/\s/g, '-').toLowerCase();
  try {
    await addDoc(collection(db, 'comments'), {
      bookId,
      text,
      createdAt: serverTimestamp()
    });
    input.value = '';
    loadComments(idx);
  } catch(e) {
    alert('등록 실패. 잠시 후 다시 시도해주세요.');
  }
}

renderList();
</script>
</body>
</html>
